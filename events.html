        let hexa = ''
        let arr = ['a', 'b', 'c', 'd', 'e', 'f', '0', '1', '2', '3', '4', '5', '6']
        for (let index = 0; index < 6; index++) {
            let randomNum = Math.floor(Math.random() * arr.length) // 0 -12
            hexa = hexa + arr[randomNum]
        }
        return `#${hexa}`
    }
